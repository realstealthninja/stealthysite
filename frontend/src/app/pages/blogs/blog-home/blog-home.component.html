<header>
  <h1>Blogs</h1>
  <p>Some of my latest blogs</p>
</header>

<main>
  @if (userAuth.isLoggedIn) {
    <nav class="blog-nav">
      <ul>
        <li>
          <a [routerLink]="'new'">Create</a>
        </li>

        <li>
          <input
            class="search-bar"
            type="text"
            placeholder="titles, tags, authors"
          />
        </li>
      </ul>
    </nav>
  } @else {
    <input class="search-bar" type="text" placeholder="titles, tags, authors" />
  }
  <section class="cards-grid">
    @for (blog of blogs(); track $index) {
      <app-card
        [title]="blog.title"
        [blog]="blog"
        [author]="blog | author | async"
      ></app-card>
    } @empty {
      No blogs yet...
    }
  </section>
</main>

<footer></footer>
