
services:
  frontend:
    container_name: frontend
    networks:
      - stealthysite
    build:
      dockerfile: ./frontend/Dockerfile
    ports:
      - "8080:80"

  backend:
    container_name: backend
    networks:
      - stealthysite
    env_file:
      - .env
    build:
      dockerfile: ./backend/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8050:8080"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - stealthysite
    depends_on:
      - backend
      - frontend

  postgres:
    container_name: postgres
    networks:
      - stealthysite
    image: "postgres:17.5-alpine3.21"
    ports:
      - "5432:5432"
    env_file:
      - .env

  postgres-admin:
    image: dpage/pgadmin4:latest
    depends_on:
      - postgres
    ports:
      - "5050:5050"
    networks:
      - stealthysite
    env_file:
      - .env

# networks
networks:
  stealthysite:
    driver: bridge
